<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBoard - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f6fc, #eef0ff);
            color: #252541;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            background: white;
            width: min(100%, 420px);
            border-radius: 16px;
            padding: 32px 26px;
            box-shadow: 0 18px 40px rgba(46, 49, 96, 0.12);
        }
        .brand {
            text-align: center;
            margin-bottom: 22px;
            font-size: 28px;
            font-weight: 700;
            color: #6254e8;
        }
        .auth-card h1 {
            font-size: 26px;
            margin-bottom: 8px;
            text-align: center;
        }
        .auth-card p {
            color: #6b6f86;
            text-align: center;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        label {
            font-size: 14px;
            color: #3a3e58;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dfe2f2;
            border-radius: 10px;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid rgba(98, 84, 232, 0.18);
            border-color: #6254e8;
        }
        .button {
            margin-top: 10px;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #6254e8;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        .button:hover { background: #4d40ce; }
        .meta {
            margin-top: 18px;
            text-align: center;
            color: #6b6f86;
            font-size: 14px;
        }
        .meta a {
            color: #6254e8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">📋 TeamBoard</div>
        <h1>Welcome back</h1>
        <p>Sign in to manage your projects and team updates.</p>

        <form action="dashboard.html" method="get">
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="name@company.com" />
            </div>

            <div>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" />
            </div>

            <button class="button" type="submit">Log In</button>
        </form>

        <div class="meta">
            Don’t have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</body>
</html>
